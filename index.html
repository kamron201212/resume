<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Резюме</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>
  <style type="text/tailwindcss">
    @layer components {
      .tablinks { @apply flex-1 bg-inherit border-none outline-none cursor-pointer py-3.5 px-4 transition-all duration-300 hover:bg-gray-200; }
      .tablinks.active { @apply bg-gray-300; }
      .inp { @apply w-full h-12 rounded-2xl bg-black/10 px-4 text-black placeholder:text-gray-800 outline-none text-base tracking-wide; }
      .area { @apply w-full rounded-2xl bg-black/10 p-3 text-black placeholder:text-gray-800 outline-none text-sm tracking-wide resize-y; }
      .fbox { @apply w-full border border-black/40 rounded-2xl p-4 space-y-3; }
      .ftitle { @apply text-lg font-bold text-black; }
      .pv-h { @apply text-xl font-semibold border-b border-gray-200 pb-2 mb-4; }
      .ico { @apply absolute left-3.5 top-1/2 -translate-y-1/2 text-black/45 pointer-events-none w-5 h-5; }
    }
  </style>
</head>

<body class="min-h-screen font-serif">
  <div
    class="flex min-h-screen w-full items-start justify-center font-sans antialiased bg-white px-4 pt-[max(2.5rem,env(safe-area-inset-top,0px))] pb-[max(2.5rem,env(safe-area-inset-bottom,0px))]">
    <div class="w-full max-w-3xl flex flex-col gap-6">

      <!-- ТАБЫ -->
      <div class="flex overflow-hidden rounded-xl border border-gray-300 bg-white">
        <button type="button" class="tablinks active" data-tab="tab-form" onclick="openTab(event, 'tab-form')">Форма</button>
        <button type="button" class="tablinks" data-tab="tab-preview" onclick="openTab(event, 'tab-preview')">Превью</button>
      </div>

      <!-- ВКЛАДКА: ФОРМА -->
      <div id="tab-form" class="tabcontent">
        <div class="flex flex-col rounded-[45px] bg-white p-6 sm:p-10 border border-gray-300 shadow-lg">
          <div class="w-36 h-12 px-8 py-3.5 rounded-2xl bg-black/90 text-white flex items-center justify-center mb-6">
            <h1 class="text-2xl font-bold">Резюме</h1>
          </div>

          <form id="resume-form" class="w-full space-y-4" onsubmit="return false">

            <!-- Личная информация -->
            <div class="fbox">
              <h2 class="ftitle">Личная информация</h2>

              <div class="relative">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                  stroke="currentColor" class="ico">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
                </svg>
                <input id="f-name" type="text" placeholder="ФИО" class="inp pl-11">
              </div>

              <div class="relative">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                  stroke="currentColor" class="ico">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M20.25 14.15v4.098a2.25 2.25 0 0 1-2.031 2.24 48.09 48.09 0 0 1-1.919.087m-8.6 0a48.11 48.11 0 0 1-1.921-.088 2.25 2.25 0 0 1-2.031-2.24V6.75A2.25 2.25 0 0 1 5.9 4.5h4.6c1.243 0 2.25 1.007 2.25 2.25v.164M14.25 7.5v-.75A2.25 2.25 0 0 1 16.5 4.5h.75a2.25 2.25 0 0 1 2.25 2.25v.75m0 6.65-3.15-3.15a1.5 1.5 0 0 0-2.12 0L11.4 12.15" />
                </svg>
                <input id="f-position" type="text" placeholder="Желаемая должность (цель)" class="inp pl-11">
              </div>

              <div class="relative">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                  stroke="currentColor" class="ico">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M2.25 6.75c0 8.284 6.716 15 15 15h1.5a2.25 2.25 0 0 0 2.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106a1.125 1.125 0 0 0-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 0 1-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97a1.125 1.125 0 0 0 .417-1.173L6.963 3.102a1.125 1.125 0 0 0-1.091-.852H4.5A2.25 2.25 0 0 0 2.25 4.5v2.25Z" />
                </svg>
                <input id="f-phone" type="tel" placeholder="Телефон" class="inp pl-11">
              </div>

              <div class="relative">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                  stroke="currentColor" class="ico">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.92V6.75" />
                </svg>
                <input id="f-email" type="email" placeholder="Email" class="inp pl-11">
              </div>

              <div class="relative">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                  stroke="currentColor" class="ico">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
                </svg>
                <input id="f-location" type="text" placeholder="Локация (город, страна)" class="inp pl-11">
              </div>
            </div>

            <!-- Профессиональное резюме -->
            <div class="fbox">
              <h2 class="ftitle">Профессиональный профиль</h2>
              <textarea id="f-summary" rows="5" placeholder="Кратко о вашем опыте и сильных сторонах..."
                class="area"></textarea>
            </div>

            <!-- Опыт работы -->
            <div class="fbox">
              <h2 class="ftitle">Опыт работы</h2>
              <input id="f-job-title" type="text" placeholder="Должность" class="inp">
              <input id="f-job-company" type="text" placeholder="Компания" class="inp">
              <input id="f-job-period" type="text" placeholder="Период (например, 2021 – 2024)" class="inp">
              <textarea id="f-job-desc" rows="4" placeholder="Обязанности и достижения..." class="area"></textarea>
            </div>

            <!-- Образование -->
            <div class="fbox">
              <h2 class="ftitle">Образование</h2>
              <input id="f-edu-school" type="text" placeholder="Учебное заведение" class="inp">
              <input id="f-edu-degree" type="text" placeholder="Специальность / степень" class="inp">
              <input id="f-edu-period" type="text" placeholder="Период (например, 2017 – 2021)" class="inp">
            </div>

            <!-- Навыки -->
            <!-- Контейнер для красивого отображения чипсов -->
              <div class="fbox">
                <h2 class="ftitle">Навыки</h2>
                <!-- flex и gap-2 добавлены контейнеру, чтобы чипсы и инпут стояли в ряд -->
                <div id="skills-container" class="inp flex flex-wrap items-center gap-2 h-auto min-h-[40px] py-[6px]">
                  <div id="chips-wrapper" class="flex flex-wrap gap-2"></div>
                  <input type="text" id="f-skills-input" placeholder="Введите навык и нажмите Enter"class="outline-none flex-1 min-w-[150px] bg-transparent">
                </div>
                <!-- Скрытый инпут для совместимости с функцией renderResume -->
                <input type="hidden" id="f-skills">
              </div>

            <!-- Скрытое поле, чтобы не ломать твой старый код рендеринга -->
            <input type="hidden" id="f-skills">

            <button type="button" id="to-preview-btn" onclick="showTab('tab-preview')"
              class="w-full rounded-2xl bg-black/90 px-8 py-3.5 text-lg font-semibold text-white shadow-lg hover:shadow-xl hover:scale-[1.02] active:scale-95 transition-all duration-200">
              Посмотреть превью
            </button>
          </form>
        </div>
      </div>
      
      <!-- ВКЛАДКА: ПРЕВЬЮ -->
      <div id="tab-preview" class="tabcontent hidden">
        <div class="flex items-center justify-between gap-3 mb-4">
          <h2 class="text-2xl sm:text-3xl font-bold text-black">Ваше резюме</h2>
          <div class="flex gap-2">
            <button type="button" id="download-btn"
              class="rounded-lg bg-black px-4 py-2.5 font-medium text-white hover:bg-black/80 transition">Скачать PDF</button>
          </div>
        </div>

        <div id="resume-paper" class="rounded-xl border border-gray-200 bg-white p-6 sm:p-12 text-black min-h-[580px]">

          <!-- Шапка -->
          <div class="text-center">
            <div id="r-name" class="text-3xl font-bold break-words">Ваше имя</div>
            <div id="r-position" class="text-gray-600 mt-1 break-words"></div>
            <div id="r-email" class="text-sm mt-2 break-words"></div>
            <div id="r-contacts" class="text-sm mt-1 flex flex-wrap justify-center gap-x-4 break-words"></div>
          </div>

          <section id="s-summary" class="mt-8 hidden">
            <h3 class="pv-h">Профессиональный профиль</h3>
            <p id="r-summary" class="whitespace-pre-line break-words"></p>
          </section>

          <section id="s-job" class="mt-8 hidden">
            <h3 class="pv-h">Опыт работы</h3>
            <div id="r-job" class="break-words"></div>
          </section>

          <section id="s-edu" class="mt-8 hidden">
            <h3 class="pv-h">Образование</h3>
            <div id="r-edu" class="break-words"></div>
          </section>

          <section id="s-skills" class="mt-8 hidden">
            <h3 class="pv-h">Навыки</h3>
            <div id="r-skills"></div>
          </section>
        </div>
      </div>

    </div>
  </div>
  <script src="/test.js"></script>
</body>

</html>
